<!doctype html>
<meta charset="utf-8">
<!--
  Cover template for the Python series.

  Everything outside the BODY SLOT is fixed: eyebrow, palette, rule, kicker and
  footer positions are what make the covers read as a set in a Medium feed.

  To make a cover: copy to assets/NNN/cover.html, fill the slots marked EDIT,
  keep ONE body variant, delete the other three, then ./render.sh cover NNN
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:750px; }
  body {
    background:#0f1512;
    font-family:'Liberation Sans','DejaVu Sans',sans-serif;
    color:#e6edf3;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 100px; position:relative; overflow:hidden;
  }
  /* ---- fixed series identity ------------------------------------------ */
  .glow { position:absolute; right:-200px; top:-220px; width:820px; height:820px;
          border-radius:50%;
          background:radial-gradient(circle,rgba(63,185,80,.18) 0%,transparent 66%); }
  .eyebrow {
    position:absolute; top:56px; left:100px;
    font-size:21px; font-weight:700; letter-spacing:4.5px;
    color:#6e7681; text-transform:uppercase;
  }
  .eyebrow b { color:#3fb950; font-weight:700; }
  .rule { height:2px; background:#1f2a24; margin-bottom:34px; }
  .kicker { font-size:46px; font-weight:700; letter-spacing:-.8px; line-height:1.14; }
  .kicker em { color:#3fb950; font-style:normal; }
  .foot { margin-top:22px; font-size:24px; color:#6e7681;
          display:flex; gap:16px; align-items:center; }
  .dot { width:6px; height:6px; border-radius:50%; background:#30363d; }

  /* ---- body variants --------------------------------------------------- */
  .cols { display:flex; align-items:center; margin-bottom:64px; }
  .col { flex:1; display:flex; align-items:center; gap:30px; }
  .col.right { padding-left:60px; border-left:2px solid #1f2a24; }
  .num { font-family:'DejaVu Sans Mono','Liberation Mono',monospace;
         font-size:170px; line-height:.86; letter-spacing:-6px; font-weight:700; }
  .num.ok  { color:#7d8590; }
  .num.bad { color:#3fb950; text-shadow:0 0 60px rgba(63,185,80,.40); }
  .lbl { font-size:33px; font-weight:700; line-height:1.26; max-width:330px; }
  .col.left  .lbl { color:#7d8590; }
  .col.right .lbl { color:#e6edf3; }

  .hero { display:flex; align-items:center; gap:56px; margin-bottom:64px; }
  .hero .num { font-size:210px; }
  .hero .lbl { max-width:720px; color:#e6edf3; font-size:38px; }

  .claim { font-size:76px; font-weight:700; line-height:1.12; letter-spacing:-1.6px;
           margin-bottom:64px; }
  .claim em { color:#3fb950; font-style:normal; }

  .code { margin-bottom:64px; }
  .code .line { font-family:'DejaVu Sans Mono','Liberation Mono',monospace;
                font-size:58px; font-weight:700; letter-spacing:-1px; line-height:1.2;
                color:#e6edf3; white-space:nowrap; }
  .code .line em { color:#3fb950; font-style:normal;
                   text-shadow:0 0 40px rgba(63,185,80,.40); }
  .code .note { margin-top:22px; font-size:36px; font-weight:700; color:#7d8590; }
</style>

<div class="glow"></div>
<!-- EDIT 1: the topic tag and the series number (file number + 1: 137_... is No. 138) -->
<div class="eyebrow">Python &nbsp;·&nbsp; Context managers &nbsp;·&nbsp; <b>No.&nbsp;139</b></div>

<!-- ============ BODY SLOT — keep exactly one of the four =============== -->

<!-- VARIANT D: one line of code, accent on the part that bites, plus a short
     muted note. The usual pick for this series: the trap fits in one line. -->
<div class="code">
  <div class="line"><em>self</em>.started = time.perf_counter()</div>
  <div class="note">one instance, shared by every decorated call</div>
</div>

<!-- ==================================================================== -->

<div class="rule"></div>
<!-- EDIT 2: the kicker. One line, states the claim. <em> only if the body used no accent. -->
<div class="kicker">One manager for with and @, two opposite reuse rules</div>
<!-- EDIT 3: the footer. Python version, the module or feature, series claim. -->
<div class="foot">
  <span>Python 3.12.3</span><span class="dot"></span>
  <span>ContextDecorator</span><span class="dot"></span>
  <span>every code block runs</span>
</div>
